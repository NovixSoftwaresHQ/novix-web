# Production builds (Netlify context "production") fail unless SITE_URL is set to the confirmed domain.
# Deploy Previews and branch deploys build as noindex. See NETLIFY-SEO-LAUNCH.md.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # SITE_URL is a public origin that the build writes into every page (canonical tags, sitemap,
  # robots.txt). If it is ever marked as a secret, Netlify's secrets scanning finds it in the
  # output and fails the build, so it is excluded from scanning. Other secrets are still scanned.
  SECRETS_SCAN_OMIT_KEYS = "SITE_URL"

# Fingerprinted build files never change, so browsers may cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
